name: bioforge-lab
services:
  app:
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8002}:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://bioforge:bioforge@postgres:5432/bioforge
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes: ["app-data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bioforge
      POSTGRES_PASSWORD: bioforge
      POSTGRES_DB: bioforge
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
volumes:
  app-data:
  postgres-data:
  mlflow-data:
